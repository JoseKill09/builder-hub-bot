<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Builder Hub: un paquete (el ZIP) abierto del que sale una flecha hacia arriba (se publica). Seguro para el recorte circular. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#F0436A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- caja isométrica -->
  <g stroke-linejoin="round">
    <path d="M150 262 L256 322 L256 412 L150 352 Z" fill="#fff"/>
    <path d="M362 262 L256 322 L256 412 L362 352 Z" fill="#fff" fill-opacity="0.78"/>
    <path d="M150 262 L256 202 L362 262 L256 322 Z" fill="#7A1F3D" fill-opacity="0.35"/>
    <!-- solapas abiertas -->
    <path d="M150 262 L106 222 L212 162 L256 202 Z" fill="#fff" fill-opacity="0.55"/>
    <path d="M362 262 L406 222 L300 162 L256 202 Z" fill="#fff" fill-opacity="0.4"/>
  </g>
  <!-- flecha que sale -->
  <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 280 V112"/>
    <path d="M200 166 L256 110 L312 166"/>
  </g>
</svg>

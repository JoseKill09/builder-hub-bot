<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=block">
<style>
html,body{margin:0}
.b{width:640px;height:360px;position:relative;overflow:hidden;background:#FBF6F2;font-family:Inter,sans-serif;display:flex;align-items:center;gap:34px;padding:0 46px;box-sizing:border-box}
.b::before{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#FF8A3D33,transparent 70%)}
.b::after{content:"";position:absolute;left:-80px;bottom:-160px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#F0436A26,transparent 70%)}
.logo{width:164px;height:164px;border-radius:40px;overflow:hidden;box-shadow:0 18px 40px #F0436A55;flex:none;position:relative;z-index:1}
.logo img{width:100%;height:100%}
.t{position:relative;z-index:1}
h1{margin:0;font:600 60px/1 Fraunces,serif;letter-spacing:-.02em;background:linear-gradient(90deg,#1B1416 50%,#F0436A);-webkit-background-clip:text;color:transparent}
p{margin:14px 0 0;font:500 21px/1.35 Inter,sans-serif;color:#4A3F43;max-width:340px}
.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;max-width:360px}
.chips span{font:500 13px Inter;padding:5px 11px;border-radius:99px;background:#F0436A17;color:#D4335A}
</style></head><body>
<div class="b"><div class="logo"><img src="logo.svg"></div>
<div class="t"><h1>Builder Hub</h1><p>Ship your Telegram Serverless bot from any AI chat.</p>
<div class="chips"><span>No terminal</span><span>Versions &amp; rollback</span><span>Your code never runs here</span></div></div></div>
</body></html>
